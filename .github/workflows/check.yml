name: Check and publish

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - README.md
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    # This job runs third-party mod tests, so it holds no secrets and a read-only token.
    permissions:
      contents: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Validate and test each mod at its pinned commit
        run: node scripts/check.mjs results/results.json

      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: results/results.json

  publish:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: results
          path: results

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read stars and update dates from each mod's repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/stats.mjs results/stats.json

      - name: Assemble the site
        run: node scripts/assemble.mjs results/results.json results/stats.json public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
